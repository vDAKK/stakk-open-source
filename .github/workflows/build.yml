name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Frida 15 ne publie son binding natif que jusqu'à Node 18 (ABI 108).
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Zip dist
        id: zip
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $zip = "stakk-v$version.zip"
          Compress-Archive -Path dist\* -DestinationPath $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v5
        with:
          name: stakk-windows
          path: ${{ steps.zip.outputs.zip }}

      # Une release par version de package.json : créée au premier build de
      # cette version, puis son zip est remplacé à chaque nouveau build.
      - name: Publier la release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.zip.outputs.tag }}
          ZIP: ${{ steps.zip.outputs.zip }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $env:ZIP --clobber
          } else {
            gh release create $env:TAG $env:ZIP --title "STAKK $env:TAG" --generate-notes --target $env:GITHUB_SHA
          }
          exit $LASTEXITCODE
