    :t('fmNoCopyFound');
}

// ─── Recherche d'item ──────────────────────────────────────────────────────

function fmSearchDebounced(q){
  clearTimeout(FM.searchTimer);
  FM.searchTimer=setTimeout(()=>fmSearch(q),280);
}

async function fmSearch(q){
  const box=$('fmRes');if(!box)return;
  if(!q||q.trim().length<2){box.innerHTML='';return}
  box.innerHTML='<div class="fm-res-row" style="cursor:default;color:var(--dim)">'+t('searching')+'</div>';
  let items=[];
  try{items=(await api('GET','fm/items?q='+encodeURIComponent(q))).items||[]}
  catch(e){box.innerHTML='<div class="fm-res-row" style="cursor:default;color:var(--red)">'+fmEsc(e.message||t('error'))+'</div>';return}
  if(!items.length){box.innerHTML='<div class="fm-res-row" style="cursor:default;color:var(--dim)">'+t('fmNoForgeableItem')+'</div>';return}
  box.innerHTML=items.map(it=>`<div class="fm-res-row" onclick="fmPickItem(${it.id})">
    ${it.img?`<img src="${fmEsc(it.img)}" alt="">`:'<div style="width:28px"></div>'}
    <div><div class="fm-res-name">${fmEsc(it.name)}</div><div class="fm-res-meta">${t('lvlShort')} ${it.level} — ${fmEsc(it.typeName||'')}</div></div>
  </div>`).join('');
}

async function fmPickItem(id){
  $('fmRes').innerHTML='';
  const q=$('fmQ');if(q)q.value='';
  try{
    const r=await api('GET','fm/item?id='+id);
    FM.item=r.item;
    FM.meta={defaults:r.defaults,axis:r.axis,runes:r.runes,labels:r.labels,exos:r.exos||[],
             weights:r.weights||null,maxLineWeight:r.maxLineWeight||null};
    FM.targets={};
    FM.thresholds={};
    for(const s of r.item.stats){
      const d=r.defaults[s.effectId];
      if(d)FM.targets[s.effectId]=[d[0],Math.max(d[1],d[0])];
    }
    fmRenderItem();
    // Les blocs d'exécution ET d'observation sont rendus avant qu'un item
    // soit choisi. Aucun des deux n'est sondé dans cet état, donc sans ce
    // rafraîchissement leurs boutons resteraient désactivés pour toujours
    // avec « choisis un item d'abord » alors qu'un item est choisi.
    await fmPoll();
    await fmRefreshLive();
  }catch(e){toast(e.message||t('error'))}
}

function fmRenderItem(){
  const box=$('fmItemBox');if(!box)return;
  const it=FM.item;
  if(!it){box.innerHTML='<div class="fm-note">'+t('fmPickItemNote')+'</div>';return}
  const rows=it.stats.map(s=>{
    const eid=s.effectId;
    const on=!!FM.targets[eid];
    const axis=(FM.meta.axis||{})[eid]||Math.max((s.to||s.from)*2,10);
    const tg=FM.targets[eid]||[s.to||s.from,s.to||s.from];
    const tiers=(FM.meta.runes||{})[eid]||[];
    const label=(FM.meta.labels||{})[eid]||(t('fmEffect')+' '+eid);
    const th=FM.thresholds[eid]||[null,null];
    return `<tr class="${on?'':'fm-off'}" id="fmrow-${eid}">
      <td style="width:26px"><input type="checkbox" ${on?'checked':''} onchange="fmToggleStat('${eid}',this.checked)"></td>
      <td>
        <div class="fm-st-name">${fmEsc(label)}</div>
        <div class="fm-st-base">${t('fmBaseRoll')} ${s.from}${s.to&&s.to!==s.from?' '+t('fmTo')+' '+s.to:''}</div>
      </td>
      <td style="min-width:250px">${fmNumPairHtml('t'+eid,tg[0],tg[1])}${fmRangeHtml('t'+eid,0,axis,tg[0],tg[1],1)}</td>
      <td style="width:150px">
        <div class="fm-st-base">${tiers.map(x=>'+'+x.amount).join(' / ')||'—'}</div>
        ${(()=>{const w=FM.meta.weights&&FM.meta.weights[eid];if(!w||w.coef==null)return '';
          return `<div class="fm-st-base" title="${t('fmWeightTitle')} ${FM.meta.maxLineWeight||101}">${t('fmWeight')} ${w.coef}/${t('fmPerPoint')}${w.uncertain?' ('+t('fmUncertain')+')':''}</div>`})()}
        ${FM.adv?`<div class="fm-row" style="gap:5px;margin-top:5px">
          <input class="fm-num" style="width:52px" type="number" min="1" placeholder="Pa" value="${th[0]==null?'':th[0]}" onchange="fmSetThreshold('${eid}',0,this.value)">
          <input class="fm-num" style="width:52px" type="number" min="1" placeholder="Ra" value="${th[1]==null?'':th[1]}" onchange="fmSetThreshold('${eid}',1,this.value)">
        </div>`:''}
      </td>
    </tr>`;
  }).join('');

  box.innerHTML=`<div class="fm-item">
      ${it.img?`<img src="${fmEsc(it.img)}" alt="">`:''}
      <div><div class="n">${fmEsc(it.name)}</div><div class="m">${t('lvlShort')} ${it.level} — ${fmEsc(it.typeName||'')} — ${it.stats.length} ${t('fmForgeableStats')}</div></div>
      <div style="flex:1"></div>
      <button class="fm-btn ghost" onclick="fmToggleAdv()">${FM.adv?t('fmHideThresholds'):t('fmShowThresholds')}</button>
      <button class="fm-btn ghost" onclick="fmResetTargets()">${t('reset')}</button>
    </div>
    <table class="fm-stats"><thead><tr><th></th><th>${t('fmStat')}</th><th>${t('fmTargetRoll')}</th><th>${t('fmRunes')}</th></tr></thead><tbody>${rows}${fmExoRows()}</tbody></table>
    <div class="fm-note" style="margin-top:8px">${t('fmTargetsHelp')}</div>
    ${FM.adv?'<div class="fm-note" style="margin-top:10px">'+t('fmThresholdsHelp')+'</div>':''}
    <div id="fmPresets" style="margin-top:12px"></div>`;
  fmRenderPresets();
}

// ─── Presets ───────────────────────────────────────────────────────────────
// Un preset = un item + ses objectifs + ses seuils. Rangé côté exe dans
// config.json, donc partagé entre les navigateurs et conservé aux MAJ.

function fmRenderPresets(){
  const box=$('fmPresets');if(!box)return;
  const names=Object.keys(FM.presets||{}).sort((a,b)=>a.localeCompare(b));
  box.innerHTML=`<div class="fm-row">
      <input class="fm-num" id="fmPresetName" style="width:190px;text-align:left;padding:6px 10px"
             type="text" placeholder="${t('fmPresetName')}" value="${fmEsc(FM.item?FM.item.name:'')}">
      <button class="fm-btn ghost" style="height:30px;padding:0 12px;font-size:12px" onclick="fmSavePreset()">${t('save')}</button>
      ${names.length?`<span class="fm-lbl">|</span>
        <select id="fmPresetPick" class="fm-num" style="width:auto;min-width:150px;text-align:left;padding:6px 10px">
          ${names.map(n=>`<option value="${fmEsc(n)}">${fmEsc(n)}</option>`).join('')}
        </select>
        <button class="fm-btn ghost" style="height:30px;padding:0 12px;font-size:12px" onclick="fmLoadPreset()">${t('load')}</button>
        <button class="fm-btn ghost" style="height:30px;padding:0 12px;font-size:12px" onclick="fmDeletePreset()">${t('delete')}</button>`:''}
    </div>`;
}

async function fmSavePreset(){
  if(!FM.item)return toast(t('fmPickItemFirst'));
  const name=($('fmPresetName')?.value||'').trim()||FM.item.name;
  const value={
    itemId:FM.item.id,itemName:FM.item.name,
    targets:JSON.parse(JSON.stringify(FM.targets)),
    thresholds:JSON.parse(JSON.stringify(FM.thresholds)),
  };
  try{
    const cfg=await api('POST','fm/config',{preset:{key:name,value}});
    FM.presets=cfg.presets||{};
    toast(t('fmPresetSaved').replace('{name}',name));
    fmRenderPresets();
  }catch(e){toast(e.message||t('error'))}
}

async function fmLoadPreset(){
  const key=$('fmPresetPick')?.value;
  const p=key&&FM.presets?FM.presets[key]:null;
  if(!p)return toast(t('fmPresetNotFound'));
  // fmPickItem remet les objectifs par défaut : on charge l'item d'abord,
  // puis on écrase avec ceux du preset.
  if(!FM.item||FM.item.id!==p.itemId)await fmPickItem(p.itemId);
  if(!FM.item)return;
  FM.targets=JSON.parse(JSON.stringify(p.targets||{}));
  FM.thresholds=JSON.parse(JSON.stringify(p.thresholds||{}));
  fmRenderItem();
  await fmPoll();
  toast(t('fmPresetLoaded').replace('{name}',key));
  fmPushLive();
}

async function fmDeletePreset(){
  const key=$('fmPresetPick')?.value;
  if(!key)return;
  try{
    const cfg=await api('POST','fm/config',{deletePreset:key});
    FM.presets=cfg.presets||{};
    fmRenderPresets();
    toast(t('fmPresetDeleted'));
  }catch(e){toast(e.message||t('error'))}
}

// ─── Exos ──────────────────────────────────────────────────────────────────
// Une caractéristique que l'item n'a pas (PA, PM, PO). Travaillée APRÈS les
// stats de base : la tenter avant reviendrait à gaspiller des runes sur un
// objet qu'on va encore modifier.
function fmExoRows(){
  const exos=(FM.meta&&FM.meta.exos)||[];
  if(!exos.length)return '';
  return `<tr><td colspan="4" style="padding-top:14px">
      <div class="fm-lbl" style="font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:1px;font-size:10px">
        ${t('fmExoHeader')}
      </div></td></tr>`
    +exos.map(e=>{
      const eid=e.effectId;
      const on=!!FM.targets[eid];
      const tg=FM.targets[eid]||[1,1];
      return `<tr class="${on?'':'fm-off'}" id="fmrow-${eid}">
        <td style="width:26px"><input type="checkbox" ${on?'checked':''} onchange="fmToggleExo('${eid}',this.checked)"></td>
        <td><div class="fm-st-name">${fmEsc(e.label)}</div><div class="fm-st-base">${t('fmAbsentFromItem')}${e.cost?' — '+t('fmResidueRequired')+' '+e.cost:''}</div></td>
        <td style="min-width:210px">
          <div class="fm-row">
            <span class="fm-lbl">${t('fmAim')}</span>
            <input class="fm-num" type="number" min="1" max="20" value="${tg[0]}" ${on?'':'disabled'}
                   onchange="fmSetExoGoal('${eid}',this.value)">
          </div>
        </td>
        <td style="width:150px"><div class="fm-st-base">${e.tiers.map(t=>'+'+t.amount).join(' / ')}</div></td>
      </tr>`;
    }).join('');
}

function fmToggleExo(eid,on){
  if(on)FM.targets[eid]=[1,1];
  else delete FM.targets[eid];
  fmRenderItem();
  fmPoll();
  fmPushLive();
}

function fmSetExoGoal(eid,value){
  const v=Math.max(1,Math.min(20,+value||1));
  FM.targets[eid]=[v,v];
  fmPushLive();
}

function fmToggleAdv(){FM.adv=!FM.adv;fmRenderItem()}

function fmResetTargets(){
  if(!FM.item||!FM.meta)return;
  FM.targets={};FM.thresholds={};
  for(const s of FM.item.stats){
    const d=FM.meta.defaults[s.effectId];
    if(d)FM.targets[s.effectId]=[d[0],Math.max(d[1],d[0])];
  }
  fmRenderItem();
  fmPushLive();
}

function fmToggleStat(eid,on){
  if(on){
    const s=FM.item.stats.find(x=>String(x.effectId)===String(eid));
    const d=(FM.meta.defaults||{})[eid]||[s.to||s.from,s.to||s.from];
    FM.targets[eid]=[d[0],Math.max(d[1],d[0])];
    fmRenderItem();
    fmPushLive();
  }else{
    delete FM.targets[eid];
    const row=$('fmrow-'+eid);if(row)row.classList.add('fm-off');
    fmPushLive();
  }
}

function fmSetThreshold(eid,idx,value){
  const v=value===''?null:Math.max(1,+value||1);
  const cur=FM.thresholds[eid]||[null,null];
  cur[idx]=v;
  FM.thresholds[eid]=cur;
  fmPushLive();
}

// ─── Calibration ───────────────────────────────────────────────────────────

function fmStopCapturePolling(){if(FM&&FM.capPoll){clearInterval(FM.capPoll);FM.capPoll=null}}
function fmStartCapturePolling(){if(!FM||FM.capPoll)return;FM.capPoll=setInterval(fmRefreshCapture,1200)}

async function fmRefreshCapture(){
  const box=$('fmCalib');
  if(!box){fmStopCapturePolling();return}
  // 'dry' suit exactement le même chemin que 'live' (calibration puis
  // observation) — seul l'envoi diffère.
  if(FM.transport==='sim'){box.innerHTML='';FM._calHtml=null;fmStopCapturePolling();return}
  const id=fmAccountId();
  try{FM.capture=await api('GET','fm/capture/status?accountId='+id)}
  catch(e){box.innerHTML='<div class="fm-warn">'+t('fmCalibUnavailable')+' '+fmEsc(e.message||'')+'</div>';FM._calHtml=null;fmStopCapturePolling();return}
  const c=FM.capture;
  // Le compteur de paquets ne bouge que si on redemande l'état : sans ce
  // sondage il restait figé à 0 jusqu'à ce qu'on change d'onglet.
  if(c.running)fmStartCapturePolling();else fmStopCapturePolling();
  if(!c.available){
    box.innerHTML='<div class="fm-warn">'+t('fmCaptureUnsupported')+'</div>';
    FM._calHtml=null;
    return;
  }
  const p=c.profile;
  const guessed=p&&p.readyConfidence==='low';
  const builtin=c.profileSource==='builtin';
  const banner=c.calibrated
    ? (builtin
        ? '<div class="fm-note" style="margin-bottom:10px">'+t('fmProtocolBuiltin')+'</div>'
        : `<div class="fm-note" style="margin-bottom:10px">${t('fmProtocolLocal').replace('{len}',p?p.uidLength:'?').replace('{off}',p?p.uidOffset:'?')}</div>`
          +(guessed?'<div class="fm-warn" style="margin-bottom:10px">'+t('fmProtocolGuessed')+'</div>':''))
    : '<div class="fm-warn" style="margin-bottom:10px">'+t('fmNoProtocol')+'</div>';

  const html=banner+`
    <div id="fmLiveBox" style="margin-bottom:12px"></div>
    <details style="margin-top:4px" ${FM._calOpen?'open':''} ontoggle="FM._calOpen=this.open">
      <summary style="cursor:pointer;font-size:11.5px;color:var(--dim)">${t('fmRecalibrate')}</summary>
      <div class="fm-note" style="margin:10px 0">
        ${t('fmRecalibrateHelp')}
        ${t('fmDump')} <b>${fmEsc(c.file||'')}</b>.
      </div>
      <div class="fm-act">
        ${c.running
          ? `<button class="fm-btn stop" onclick="fmCapture(false)">${t('fmStopCapture')} (${c.count} ${t('fmPackets')})</button>`
          : '<button class="fm-btn ghost" onclick="fmCapture(true)">'+t('fmStartCapture')+'</button>'}
        ${!c.running&&c.analyzer
          ? `<button class="fm-btn ghost" id="fmCalBtn" onclick="fmCalibrate()" ${c.captureBytes?'':'disabled'}>${t('fmAnalyzeCapture')}</button>`:''}
        ${!builtin?'<button class="fm-btn ghost" onclick="fmCalibrateReset()">'+t('fmBackToBuiltin')+'</button>':''}
      </div>
      <div id="fmCalOut" style="margin-top:10px"></div>
    </details>`;

  // Même précaution que pour le bloc d'exécution : ce sondage tourne toutes
  // les 1,2 s et la zone contient des boutons. Réécrire le DOM à chaque tour
  // ferait perdre les clics qui tombent au mauvais moment.
  //
  // Et quand on réécrit, #fmLiveBox est recréé VIDE : il faut invalider son
  // cache, sinon fmRefreshLive() calcule le même html qu'avant, croit n'avoir
  // rien à faire, et la zone d'observation reste blanche.
  if(FM._calHtml!==html){FM._calHtml=html;box.innerHTML=html;FM._liveHtml=null}
  fmRefreshLive();
}

// ─── Observation de l'atelier (mode Jeu) ───────────────────────────────────
// STAKK doit avoir VU les stats de l'item et l'inventaire de runes avant de
// pouvoir jeter quoi que ce soit. Ce bloc rend cette étape explicite au lieu
// de laisser l'utilisateur découvrir un refus au moment de cliquer Forger.

function fmStopLivePolling(){if(FM&&FM.livePoll){clearInterval(FM.livePoll);FM.livePoll=null}}
function fmStartLivePolling(){if(!FM||FM.livePoll)return;FM.livePoll=setInterval(fmRefreshLive,1500)}

async function fmRefreshLive(){
  const box=$('fmLiveBox');
  if(!box||FM.transport==='sim'){fmStopLivePolling();return}
  let st;
  try{st=await api('GET','fm/live/status?accountId='+fmAccountId())}
  catch(e){box.innerHTML='';fmStopLivePolling();return}
  const wasReady=!!(FM.live&&FM.live.ready);
  const wasCopies=FM.live&&FM.live.copies;
  FM.live=st;
  if(st.copies!==wasCopies)fmRenderAllDetail();
  // Le bouton Forger s'arme/se désarme sur ce changement : on redessine le
  // bloc d'exécution seulement quand l'état bascule, pas à chaque sondage.
  if(!!st.ready!==wasReady)fmPoll();
  if(!st.available){box.innerHTML='<div class="fm-warn">'+t('fmLiveUnavailable')+'</div>';fmStopLivePolling();return}
  if(!st.calibrated){box.innerHTML='';fmStopLivePolling();return}

  const paintLive=html=>{if(FM._liveHtml===html)return;FM._liveHtml=html;box.innerHTML=html};

  if(!st.armed){
    fmStopLivePolling();
    // L'observation s'arme toute seule dès qu'un item est choisi : c'est une
    // étape technique, pas une décision de l'utilisateur.
    if(FM.item&&!FM._arming){
      FM._arming=true;
      api('POST','fm/live/arm',{accountId:fmAccountId(),itemId:FM.item.id})
        .catch(()=>{})
        .then(()=>{FM._arming=false;fmRefreshLive()});
      paintLive('<div class="fm-note">'+t('fmReadingWorkshop')+'</div>');
      return;
    }
    paintLive(`<div class="fm-note">
        ${t('fmLiveIntro')}
        ${FM.item?'':t('fmPickItemToStart')}
      </div>`);
    return;
  }

  fmStartLivePolling();
  const stats=Object.entries(st.stats||{});
  // On ne compte que ce qui est réellement disponible : le serveur envoie
  // aussi les quantités tombées à zéro, les afficher gonflerait le compte.
  const runes=Object.entries(st.stock||{}).filter(([,q])=>q>0);
  paintLive(`<div class="${st.ready?'fm-note':'fm-warn'}" style="margin-bottom:8px">
      ${st.ready
        ? t('fmWorkshopRead').replace('{stats}',stats.length).replace('{runes}',runes.length)
        : fmEsc(st.diagnostic||t('fmObserving'))}
    </div>
    <div class="fm-state" style="margin-bottom:8px">
      <span>${t('fmObservedItem')} <b>${fmEsc(st.itemName||'—')}</b></span>
      <span>${t('fmReads')} <b>${st.observations||0}</b></span>
      ${stats.map(([k,v])=>`<span>${fmEsc((FM.meta&&FM.meta.labels&&FM.meta.labels[k])||('#'+k))} <b>${v}</b></span>`).join('')}
    </div>
    <div class="fm-row" style="margin-bottom:8px">
      ${st.reliquatKnown
        ? `<span class="fm-lbl">${t('fmResidueRead')} <b style="color:var(--text)">${st.reliquat==null?'—':st.reliquat}</b></span>
           <button class="fm-btn ghost" style="height:26px;padding:0 10px;font-size:11px" onclick="fmForgetReliquat()">${t('fmRelearn')}</button>`
        : `<span class="fm-lbl">${t('fmResidueUnknown')}
             <input class="fm-num" id="fmReliquat" type="number" min="0" style="width:70px" placeholder="${t('fmValue')}">
             <button class="fm-btn ghost" style="height:26px;padding:0 10px;font-size:11px" onclick="fmLearnReliquat()">${t('fmLearn')}</button>
           </span>`}
    </div>
    <div id="fmReliquatOut" class="fm-lbl" style="margin-bottom:8px"></div>
    <div class="fm-act"><button class="fm-btn ghost" onclick="fmLiveDisarm()">${t('fmStopObserving')}</button></div>`);
}

// Le jeu affiche le reliquat mais rien ne dit quel champ le porte. On le fait
// apprendre une fois par sa valeur, puis STAKK le suit tout seul.
async function fmLearnReliquat(){
  const out=$('fmReliquatOut');
  const v=+($('fmReliquat')?.value||NaN);
  if(!Number.isFinite(v)||v<0){if(out)out.textContent=t('fmEnterWorkshopValue');return}
  let r;
  try{r=await api('POST','fm/reliquat/learn',{accountId:fmAccountId(),value:v})}
  catch(e){if(out)out.textContent=e.message||t('error');return}
  if(r.ok){toast(t('fmResidueFound'));FM._liveHtml=null;fmRefreshLive();return}
  if(out)out.textContent=r.detail||(t('loginFailed')+' : '+r.reason);
}

async function fmForgetReliquat(){
  try{await api('POST','fm/reliquat/forget',{accountId:fmAccountId()})}catch(e){}
  FM._liveHtml=null;
  fmRefreshLive();
}

async function fmLiveArm(){
  if(!FM.item)return toast(t('fmPickItemFirst'));
  try{await api('POST','fm/live/arm',{accountId:fmAccountId(),itemId:FM.item.id});toast(t('fmObservationArmed'))}
  catch(e){toast(e.message||e.error||t('error'))}
  fmRefreshLive();
}

async function fmLiveDisarm(){
  try{await api('POST','fm/live/disarm',{accountId:fmAccountId()})}catch(e){}
  FM.live=null;
  fmStopLivePolling();
  fmRefreshLive();
}

async function fmCalibrate(){
  const out=$('fmCalOut');
  if(out)out.innerHTML='<div class="fm-note">'+t('fmAnalyzing')+'</div>';
  let r;
  try{r=await api('POST','fm/calibrate',{accountId:fmAccountId()})}
  catch(e){if(out)out.innerHTML='<div class="fm-warn">'+fmEsc(e.message||t('error'))+'</div>';return}
  if(r.ok){
    toast(t('fmProtocolCalibrated'));
    await fmRefreshCapture();
    const o=$('fmCalOut');
    if(o)o.innerHTML='<div class="fm-note">'+t('fmAnalyzed')+' '+(r.stats?r.stats.out+' '+t('fmOutgoingPackets')+', ':'')+
      t('fmMoveDetected')+' '+r.profile.moveMsgId+'.</div>';
    return;
  }
  if(out)out.innerHTML='<div class="fm-warn"><b>'+t('fmCalibrationImpossible')+'</b> — '+fmEsc(r.detail||r.reason)+'</div>';
}

async function fmCalibrateReset(){
  try{await api('POST','fm/calibrate/reset',{accountId:fmAccountId()});toast(t('fmProfileForgotten'))}
  catch(e){toast(e.message||t('error'))}
  fmRefreshCapture();
}

async function fmCapture(start){
  const id=fmAccountId();
  try{
    const r=await api('POST','fm/capture/'+(start?'start':'stop'),{accountId:id});
    if(start)toast(t('fmCaptureRunning'));
    else toast(t('fmCaptureStopped')+(r.count!=null?' — '+r.count+' '+t('fmPackets'):''));
  }catch(e){toast(e.message||t('error'))}
  fmRefreshCapture();
}

// ─── Exécution ─────────────────────────────────────────────────────────────

async function fmStart(){
  const accountId=fmAccountId();
  if(accountId==null)return toast(t('fmNoAccountSelected'));
  if(!FM.item)return toast(t('fmPickItemFirst'));
  const targets={};
  for(const [k,v] of Object.entries(FM.targets))targets[k]=[v[0],v[1]];
  if(!Object.keys(targets).length)return toast(t('fmCheckOneStat'));
  const thresholds={};
  for(const [k,v] of Object.entries(FM.thresholds)){
    if(v&&(v[0]!=null||v[1]!=null))thresholds[k]=v;
  }
  try{
    await api('POST','fm/start',{
      accountId,itemId:FM.item.id,targets,thresholds,
      delay:FM.delay,transport:FM.transport,
      all:FM.all,copies:FM.copies,orbe:FM.orbe,
    });
    fmStartPolling();
    await fmPoll();
  }catch(e){toast(e.message||e.error||t('error'))}
}

async function fmStop(){
  try{await api('POST','fm/stop',{accountId:fmAccountId()})}
  catch(e){toast(e.message||t('error'))}
  await fmPoll();
}

async function fmPoll(){
  const box=$('fmRunBox');
  if(!box){fmStopPolling();return}
  const id=fmAccountId();
  if(id==null)return;
  let run=null;
  try{run=(await api('GET','fm/status?accountId='+id)).run}
  catch(e){box.innerHTML='<div class="fm-note">'+fmEsc(e.message||t('error'))+'</div>';fmStopPolling();return}
  FM.run=run;
  fmAlertOnFinish(run);
  // 'waiting-item' est actif : le run n'est pas fini, il attend l'utilisateur.
  // Sans ça le sondage s'arrêterait et la reprise passerait inaperçue.
  const active=run&&(run.status==='running'||run.status==='starting'||run.status==='waiting-item');
  if(active)fmStartPolling();else fmStopPolling();
  fmRenderRun(box,run,active);
}

// Libellés d'état du run — traduits à l'affichage via t()
const FM_STATUS_KEY={starting:'fmStatusStarting',running:'fmStatusRunning','waiting-item':'fmStatusWaitingItem',done:'fmStatusDone',stopped:'fmStatusStopped',blocked:'fmStatusBlocked',error:'fmStatusError'};

// ─── Alerte de fin ─────────────────────────────────────────────────────────
// Une session de forge dure : on ne reste pas devant l'écran. Un exo décroché
// ou un stock épuisé doivent s'entendre.

// Bip généré à la volée : pas de fichier à héberger, pas de requête réseau.
function fmBeep(pattern){
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx)return;
    const ctx=new Ctx();
    let t=ctx.currentTime;
    for(const[freq,dur]of pattern){
      const osc=ctx.createOscillator(),gain=ctx.createGain();
      osc.frequency.value=freq;osc.type='sine';
      gain.gain.setValueAtTime(0.0001,t);
      gain.gain.exponentialRampToValueAtTime(0.25,t+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t);osc.stop(t+dur);
      t+=dur+0.05;
    }
    setTimeout(()=>{try{ctx.close()}catch(e){}},(t-ctx.currentTime)*1000+300);
  }catch(e){}
}

function fmNotify(title,body,kind){
  toast(title+' — '+body,8000);
  fmBeep(kind==='win'?[[880,0.12],[1170,0.12],[1560,0.22]]:[[440,0.18],[330,0.28]]);
  try{
    if(!('Notification'in window))return;
    if(Notification.permission==='granted'){new Notification(title,{body})}
    else if(Notification.permission!=='denied'){
      Notification.requestPermission().then(p=>{if(p==='granted')new Notification(title,{body})});
    }
  }catch(e){}
}

// N'alerte qu'au CHANGEMENT d'état : le sondage repasse toutes les 800 ms.
function fmAlertOnFinish(run){
  const key=run?run.status:'none';
  if(FM._lastStatus===key)return;
  const prev=FM._lastStatus;
  FM._lastStatus=key;
  if(!run||!prev||prev==='none')return;          // premier rendu : pas d'alerte
  if(prev!=='running'&&prev!=='waiting-item'&&prev!=='starting')return;

  if(run.status==='done'&&run.exoWon){
    fmNotify(t('fmExoWon'),'+'+run.exoWon.value+' '+run.exoWon.label+' — '+t('fmForgeStopped'),'win');
  }else if(run.status==='done'){
    fmNotify(t('fmForgeDone'),(run.itemName||'')+' — '+t('fmGoalsReached'),'win');
  }else if(run.status==='blocked'){
    fmNotify(t('fmForgeInterrupted'),run.error||t('fmNoRuneLeft'),'stop');
  }else if(run.status==='error'){
    fmNotify(t('fmForgeError'),run.error||'','stop');
  }
}

function fmSetTab(t){FM.tab=t;FM._runHtml=null;fmPoll()}

// Historique à la manière du jeu : une entrée par jet, puis toutes les lignes
// touchées en dessous. Le journal texte ne montrait que la stat visée, alors
// qu'un jet en casse souvent d'autres — c'est justement ce qu'on veut voir.
function fmHistoryHtml(run){
  const h=(run.history||[]);
  if(!h.length)return '<div class="fm-hist"><div class="fm-hist-e"><span class="fm-lbl">'+t('fmNoThrowYet')+'</span></div></div>';
  return '<div class="fm-hist">'+h.map(e=>{
    const time=new Date(e.t).toLocaleTimeString(uiLocale());
    const tag=e.rejected?'<span class="fm-hist-tag rej">'+t('fmThrowRejected')+'</span>'
      :e.ok?'<span class="fm-hist-tag ok">'+t('fmThrowOk')+'</span>'
      :'<span class="fm-hist-tag ko">'+t('fmThrowKo')+'</span>';
    const deltas=(e.deltas||[]).map(d=>
      `<span class="${d.delta>0?'fm-hist-up':'fm-hist-dn'}">${d.delta>0?'+':''}${d.delta} ${fmEsc(d.label)} <span class="fm-hist-w">(${d.before}→${d.after})</span></span>`
    ).join('');
    const rel=e.reliquat&&e.reliquat.delta
      ? `<span class="fm-hist-rel">${e.reliquat.delta>0?'+':''}${e.reliquat.delta} ${t('fmResidue')} <span class="fm-hist-w">(${e.reliquat.before==null?'?':e.reliquat.before}→${e.reliquat.after==null?'?':e.reliquat.after})</span></span>`
      : '';
    const lost=e.lostWeight?`<span class="fm-hist-w">${e.lostWeight} ${t('fmWeightDestroyed')}</span>`:'';
    const body=deltas+rel+lost;
    return `<div class="fm-hist-e">
      <div class="fm-hist-h">
        <span class="fm-hist-t">${time}</span>
        <b>${fmEsc(e.rune||'?')}</b>
        <span class="fm-lbl">${t('fmOn')} ${fmEsc(e.target||'?')}</span>
        ${e.exo?'<span class="fm-hist-tag exo">exo</span>':''}
        ${tag}
      </div>
      ${body?`<div class="fm-hist-d">${body}</div>`:''}
    </div>`;
  }).join('')+'</div>';
}

function fmRenderRun(box,run,active){
  // En mode Jeu on n'arme le bouton que si l'observation a réellement abouti :
  // le refus doit être visible AVANT le clic, pas après.
  const liveReady=FM.transport==='sim'||!!(FM.live&&FM.live.ready);
  const canStart=!!FM.item&&!active&&liveReady;
  const hint=!FM.item?t('fmHintPickItem')
    :(!liveReady?t('fmHintObserveFirst'):'');
  const label={sim:t('fmBtnSimulate'),dry:t('fmModeDry'),live:t('fmBtnForge')}[FM.transport]||t('launch');
  const head=`<div class="fm-act">
      <button class="fm-btn go" onclick="fmStart()" ${canStart?'':'disabled'}>
        <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
        ${label}
      </button>
      ${active?'<button class="fm-btn stop" onclick="fmStop()">'+t('stop')+'</button>':''}
      ${!active&&hint?'<span class="fm-lbl">'+hint+'</span>':''}
    </div>`;
  // Le sondage repasse ici toutes les 800 ms. Réécrire innerHTML à chaque
  // fois détruit et recrée le bouton : un clic qui tombe pile entre les deux
  // se perd. On ne touche au DOM que si le rendu a réellement changé.
  const paint=html=>{if(FM._runHtml===html)return;FM._runHtml=html;box.innerHTML=html};

  if(!run){paint(head+'<div class="fm-note" style="margin-top:10px">'+t('fmNoRun')+'</div>');return}

  const pct=Math.round((run.progress||0)*100);
  const stats=(run.targets||[]).map(x=>
    `<span>${x.exo?'exo ':''}${fmEsc(x.label)} <b>${x.current}</b>/${x.goal}</span>`).join('');
  const logs=(run.log||[]).slice(-40).map(l=>
    `<div class="${fmEsc(l.level)}">${new Date(l.t).toLocaleTimeString(uiLocale())} — ${fmEsc(l.message)}</div>`).join('');
  paint(head+`
    <div class="fm-bar"><i style="width:${pct}%"></i></div>
    <div class="fm-state">
      <span>${t('fmState')} <b>${FM_STATUS_KEY[run.status]?t(FM_STATUS_KEY[run.status]):run.status}</b></span>
      <span>${t('fmMode')} <b>${({sim:t('fmModeSim'),dry:t('fmModeDry'),live:t('fmModeLive')})[run.transport]||run.transport}</b></span>
      <span>${t('fmThrows')} <b>${run.thrown}</b></span>
      ${run.queue?`<span>${t('fmCopy')} <b>${Math.min(run.queue.index,run.queue.total)}/${run.queue.total}</b></span><span>${t('fmTotalThrows')} <b>${(run.totalThrown||0)+run.thrown}</b></span>`:''}
      <span>${t('fmProgress')} <b>${pct}%</b></span>
      ${stats}
    </div>
    ${run.error?'<div class="fm-warn" style="margin-top:10px">'+fmEsc(run.error)+'</div>':''}
    <div class="fm-tabs">
      <button class="${FM.tab!=='log'?'on':''}" onclick="fmSetTab('hist')">${t('fmHistory')}</button>
      <button class="${FM.tab==='log'?'on':''}" onclick="fmSetTab('log')">${t('fmLog')}</button>
    </div>
    ${FM.tab==='log'
      ? `<div class="fm-log">${logs||'<div class="fail">—</div>'}</div>`
      : fmHistoryHtml(run)}`);
  const log=box.querySelector('.fm-log')||box.querySelector('.fm-hist');
  if(log)log.scrollTop=log.scrollHeight;
}

// Global macro handler — fires whenever the user presses a bound key while
// in touch mode, regardless of where the focus is (sidebar, canvas, body).
document.addEventListener('keydown', (e) => {
  // Ignore les keydown répétés par l'OS quand la touche est tenue appuyée
  // — sinon chaque répétition (~30 ms) fire une nouvelle pression sur
  // Android, résultat = long press au lieu d'un tap court.
  if (e.repeat) return;
  const modeOn = document.body.classList.contains('mode-touch');
  if (!modeOn) return;
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const ae = document.activeElement;
  const tag = ae?.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || ae?.isContentEditable) return;
  const sess = tchSessions.find(s => s.id === tchActiveId);
  if (!sess) return;
  const macros = loadMacros(sess.pkg);
  const m = macros.find(mc => mc.key === e.key);

    // Stop propagation immédiate sinon le handler sur le canvas (plus bas
    // dans bindInput) re-fire la même macro → double DOWN+UP qui étend le
    // tap ET peut faire des taps fantômes sur le décor autour.
    e.stopImmediatePropagation();
    fireMacro(sess, m);
  }
});

    $('tchSbApps')?.addEventListener('click', () => { const a = activeSession(); if (a) shellKey(a, KEY_APP_SWITCH); });
    $('tchSbWake')?.addEventListener('click', refocusActiveInstance);
    $('tchSbMacro')?.addEventListener('click', () => { const a = activeSession(); if (a) startMacroRecord(a); });
    $('tchSbFull')?.addEventListener('click', () => {
      const stage = $('tchStage');
      if (!stage) return;
      if (document.fullscreenElement) document.exitFullscreen();
      else stage.requestFullscreen().catch(() => {});
    });
    host.querySelectorAll('.tch-sb-inst').forEach(el => {
      el.addEventListener('click', (e) => {
        const closeId = e.target.closest('[data-close]')?.dataset.close;
        if (closeId) { e.stopPropagation(); closeInstance(closeId); return; }
        tchActiveId = el.dataset.id;
        syncLegacySession();
        window.renderTouchView();
      });
    });
  }
}

// Open the PC launch modal: shows the accounts list and lets the user fire
// a desktop client without leaving Dofus Touch mode. Reuses the same API

  const el = $('pcLaunchAccs');

  if (!Array.isArray(A) || !A.length) {
    el.innerHTML = '<div style="padding:20px;text-align:center;color:var(--dim);font-size:12px">' + T('noAccountImported') + '</div>';

async function pcLaunchGo() {
  const gameKey = $('pcLaunchGame').value;
  const accountIds = [...$('pcLaunchAccs').querySelectorAll('input[name=pcacc]:checked')].map(i => parseInt(i.value, 10));
  if (!accountIds.length) { toast(T('pickAtLeastOneAccount')); return; }

function renderStreaming(el) {
  const active = activeSession();
  const tabs = tchSessions.map(s => `
    <button class="tch-tab ${s.id === tchActiveId ? 'on' : ''}" data-id="${s.id}">
      <span class="tch-tab-lbl">${s.label}</span>

  `).join('');

  el.innerHTML = `
    <div class="tch-wrap">
      <div class="tch-tabbar">
        ${tabs}
        <button class="tch-tab-add" id="tchAddInstance" title="${T('touchNewInstance')}">+</button>
      </div>
      <div class="tch-head">
        <span class="tch-pill ok">${active?.pkg || ''}</span>
        <div class="tch-sp"></div>
        <button class="tch-btn sec" id="tchWake" title="${T('touchWakeActiveTitle')}">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M7 10h.01M12 10h.01M17 10h.01M7 14h10"/></svg>
          Macro
        </button>
        <button class="tch-btn sec" id="tchClone" title="${T('touchCloneInstance')}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          ${T('touchClone')}
        </button>
        <div class="tch-softkeys">
          <button class="tch-btn sec" id="tchBack" title="BACK"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
          <button class="tch-btn sec" id="tchApps" title="APPS"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="1"/></svg></button>
          <button class="tch-btn sec" id="tchFullscreen" title="${T('fullscreen')}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 00-2 2v3M21 8V5a2 2 0 00-2-2h-3M3 16v3a2 2 0 002 2h3M16 21h3a2 2 0 002-2v-3"/></svg></button>
        </div>
        <button class="tch-btn danger" id="tchDisconnect">${T('touchDisconnect')}</button>
      </div>
      <div class="tch-stage" id="tchStage"></div>
    </div>
  `;

  // Mount each session's canvas inside its own 16:9 wrapper, so every tab
  // displays at the same visible size regardless of its intrinsic pixel
  // resolution (main=1080p, clones=720p).
  const stage = $('tchStage');
  for (const s of tchSessions) {
    if (!s.box) {
      s.box = document.createElement('div');
      s.box.className = 'tch-canvas-box';
      s.box.appendChild(s.canvas);
    }
    s.box.style.display = s.id === tchActiveId ? '' : 'none';
    if (s.box.parentElement !== stage) stage.appendChild(s.box);
  }

  // Tab click: switch or close. No auto-refocus — Android's "one focused
  // display at a time" rule means we can't keep all tabs live. Use the
  // dedicated "Réveiller" button below to wake the active tab on demand.
  el.querySelectorAll('.tch-tab').forEach(tab => {
    tab.addEventListener('click', (e) => {
      const closeId = e.target.closest('[data-close]')?.dataset.close;
      if (closeId) {
        e.stopPropagation();
        closeInstance(closeId);
        return;
      }
      tchActiveId = tab.dataset.id;
      syncLegacySession();
      window.renderTouchView();
    });
  });

  $('tchAddInstance').onclick = addInstanceUI;
  $('tchDisconnect').onclick = disconnectDevice;
  $('tchWake').onclick = refocusActiveInstance;
  $('tchMacro').onclick = () => { const a = activeSession(); if (a) startMacroRecord(a); };
  $('tchBack').onclick = () => { const a = activeSession(); if (a) shellKey(a, KEY_BACK); };
  $('tchApps').onclick = () => { const a = activeSession(); if (a) shellKey(a, KEY_APP_SWITCH); };
  // Draw macro overlays for the active session after a short delay so the
  // canvas has taken its final CSS size.
  requestAnimationFrame(() => renderMacroOverlay(active));
  $('tchFullscreen').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else stage.requestFullscreen().catch(err => console.warn('[tch] fullscreen error', err));
  };
  $('tchClone').onclick = cloneUI;
}

// Prompt the user to pick a dofus* package and spawn a new tab for it.
async function addInstanceUI() {
  if (!tchConn) return;
  const pmOut = await sh(tchConn.adb, ['pm', 'list', 'packages', 'dofus']);
  const allPkgs = pmOut.split('\n').map(l => l.replace(/^package:/, '').trim())
    .filter(p => p && p.startsWith('com.ankama.dofustouch'));
  // Exclude packages already open as tabs.
  const used = new Set(tchSessions.map(s => s.pkg));
  const avail = allPkgs.filter(p => !used.has(p));
  if (!avail.length) {
    if (window.toast) window.toast(T('touchNoCloneAvailable'));
    return;
  }
  const choice = prompt(T('touchPickClone') + ':\n' +
    avail.map((p, i) => (i + 1) + '. ' + p).join('\n'), '1');
  const idx = parseInt(choice, 10) - 1;
  if (isNaN(idx) || !avail[idx]) return;
  const pkg = avail[idx];
  if (window.toast) window.toast(T('starting') + ' ' + pkg + '...');
  try {
    await addInstance(pkg);
    window.renderTouchView();
  } catch (err) {
    console.error('[tch:add]', err);
    if (window.toast) window.toast('Échec: ' + (err?.message || err));
  }
}

// Prompt + run the APK clone pipeline, then auto-open a tab for the new clone.
async function cloneUI() {
  if (!tchConn) return;
  const suffix = prompt(T('touchCloneSuffix'), 'alt' + (tchSessions.length + 1));
  if (!suffix || !/^[a-z0-9_]{1,12}$/i.test(suffix)) {
    if (suffix !== null && window.toast) window.toast('Suffix invalide');
    return;
  }
  try {
    const newPkg = await cloneDofusTouch(tchConn.adb, mod, suffix, (msg) => {
      if (window.toast) window.toast(msg);
    });
    if (window.toast) window.toast(T('touchCloneInstalled') + ': ' + newPkg + ' — ' + T('opening'));
    await addInstance(newPkg);
    window.renderTouchView();
  } catch (err) {
    console.error('[tch:clone]', err);
    if (window.toast) window.toast(T('touchCloneFailed') + ': ' + (err?.message || err));
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// Manual scrcpy client — bypasses ya-webadb's AdbScrcpyClient entirely because
// its ScrcpyControlMessageWriter hangs forever on Samsung Fold + virtualDisplay
// setups (root cause: USB bulk endpoint multiplexing + Consumable semantics).
// We spawn scrcpy-server ourselves, open raw local-abstract sockets, and talk
// the binary protocol by hand. Dokky does the same thing in Rust.
// ═══════════════════════════════════════════════════════════════════════════

class BufferedReader {
  constructor(stream) {
    this.reader = stream.getReader();
    this.buf = new Uint8Array(0);
  }
  async readExactly(n) {
    const out = new Uint8Array(n);
    let got = 0;
    while (got < n) {
      if (this.buf.byteLength === 0) {
        const r = await this.reader.read();
        if (r.done) throw new Error('EOF (wanted ' + n + ', got ' + got + ')');
        this.buf = r.value;
      }
      const take = Math.min(this.buf.byteLength, n - got);
      out.set(this.buf.subarray(0, take), got);
      got += take;
      this.buf = this.buf.subarray(take);
    }
    return out;
  }
  release() { try { this.reader.releaseLock(); } catch {} }
}

async function spawnScrcpyServer(adb, scid, opts) {
  const args = [
    'CLASSPATH=/data/local/tmp/scrcpy-server.jar',
    'app_process', '/', 'com.genymobile.scrcpy.Server',
    opts.version,
    'scid=' + scid,
    // verbose so "Aborted" failures show their Java stacktrace
    'log_level=verbose',
    'audio=false', 'video=true', 'control=true',
    'tunnel_forward=true',
    'stay_awake=true',
    'new_display=' + opts.width + 'x' + opts.height + '/' + opts.dpi,
    'video_codec=h264',
    'max_fps=' + opts.fps,
    'video_bit_rate=' + opts.bitRate,
    'video_codec_options=i-frame-interval=2',
    // cleanup=true makes a running scrcpy self-destruct when the PC drops
    // the connection. In multi-instance mode it fires spuriously when a
    // sibling server starts and briefly confuses the Android DisplayManager.
    'cleanup=false',
  ];
  const proc = await adb.subprocess.noneProtocol.spawn(args.join(' '));
  (async () => {
    try {
      const r = proc.output.getReader();
      const dec = new TextDecoder();
      while (true) {
        const x = await r.read();
        if (x.done) break;
        for (const line of dec.decode(x.value).split('\n')) {
          if (line.trim()) console.log('[scrcpy]', line);
        }
      }
    } catch {}
  })();
  return proc;
}

async function readScrcpyVideoHeader(bufReader) {
  const dummy = await bufReader.readExactly(1);
  if (dummy[0] !== 0) throw new Error('scrcpy handshake: expected 0x00, got 0x' + dummy[0].toString(16));
  const nameBytes = await bufReader.readExactly(64);
  const deviceName = new TextDecoder().decode(nameBytes).replace(/\0+$/, '');
  const codecMetaBytes = await bufReader.readExactly(12);
  const v = new DataView(codecMetaBytes.buffer, codecMetaBytes.byteOffset, 12);
  const codecId = v.getUint32(0, false);
  const width = v.getUint32(4, false);
  const height = v.getUint32(8, false);
  // codecId is a u32 FourCC (e.g. 0x68323634 = 'h264'). ya-webadb's
  // WebCodecsVideoDecoder expects the numeric value (ScrcpyVideoCodecId).
  // The 4CC string is just for logging.
  const codec4cc = String.fromCharCode(
    (codecId >>> 24) & 0xFF, (codecId >>> 16) & 0xFF,
    (codecId >>> 8) & 0xFF, codecId & 0xFF
  ).replace(/\0+$/, '');
  return { deviceName, codecId, codec: codec4cc, width, height };
}

function scrcpyPacketStream(bufReader, streamCtor) {
  // Track whether the next data packet is the first one after configure().
  // WebCodecs VideoDecoder requires a key frame right after configure() or
  // flush(). scrcpy's server doesn't always set the KEY_FRAME flag on that
  // first IDR — so we force-mark it.
  let needForceKeyframe = false;
  return new streamCtor({
    async pull(controller) {
      try {
        const hdr = await bufReader.readExactly(12);
        const v = new DataView(hdr.buffer, hdr.byteOffset, 12);
        const ptsAndFlags = v.getBigUint64(0, false);
        const size = v.getUint32(8, false);
        const isConfig = (ptsAndFlags & 0x8000000000000000n) !== 0n;
        const isKey = (ptsAndFlags & 0x4000000000000000n) !== 0n;
        const pts = ptsAndFlags & 0x3FFFFFFFFFFFFFFFn;
        const data = size > 0 ? await bufReader.readExactly(size) : new Uint8Array();
        if (isConfig) {
          needForceKeyframe = true;
          controller.enqueue({ type: 'configuration', data, keyframe: false, pts });
        } else {
          const keyframe = isKey || needForceKeyframe;
          needForceKeyframe = false;
          controller.enqueue({ type: 'data', data, keyframe, pts });
        }
      } catch (err) {
        controller.error(err);
      }
    },
  });
}

async function manualInjectTouch(controlWriter, e) {
  const buf = new Uint8Array(32);
  const v = new DataView(buf.buffer);
  buf[0] = 0x02;
  buf[1] = e.action;
  v.setBigUint64(2, e.pointerId ?? 0n, false);
  v.setInt32(10, e.x, false);
  v.setInt32(14, e.y, false);
  v.setUint16(18, e.screenW, false);
  v.setUint16(20, e.screenH, false);
  v.setUint16(22, Math.round((e.pressure ?? 1) * 0xFFFF), false);
  v.setUint32(24, 0, false);
  v.setUint32(28, e.buttons ?? 0, false);
  await controlWriter.write(buf);
}

async function startScrcpyManual(adb, streamCtor, log, cfg) {
  const scid = Math.floor(Math.random() * 0x80000000).toString(16).padStart(8, '0');
  log('[manual] spawning scrcpy-server scid=' + scid);
  const proc = await spawnScrcpyServer(adb, scid, cfg);
  // Retry the socket open a few times — the scrcpy server takes variable
  // time to boot (JVM warm-up, VD creation on Samsung can be slow). We used
  // to wait a fixed 700ms which was fine for the first instance but not for
  // subsequent ones when the device is already busy.
  const tryOpen = async () => {
    for (let i = 0; i < 10; i++) {
      await new Promise(r => setTimeout(r, 400));
      try {
        return await adb.createSocket('localabstract:scrcpy_' + scid);
      } catch (err) {
        if (i === 9) throw err;
        log('[manual] socket open attempt ' + (i + 1) + ' failed, retrying...', err?.message || err);
      }
    }
  };
  log('[manual] opening video + control sockets (with retry)...');
  const videoSocket = await tryOpen();
  const controlSocket = await tryOpen();
  const bufReader = new BufferedReader(videoSocket.readable);
  log('[manual] reading handshake...');
  const meta = await readScrcpyVideoHeader(bufReader);
  log('[manual] handshake OK:', meta);
  const packets = scrcpyPacketStream(bufReader, streamCtor);
  const controlWriter = controlSocket.writable.getWriter();
  return {
    scid, meta, proc, packets,
    injectTouch: (e) => manualInjectTouch(controlWriter, e),
    close: async () => {
      try { controlWriter.releaseLock(); } catch {}
      try { await controlSocket.close(); } catch {}
      try { bufReader.release(); } catch {}
      try { await videoSocket.close(); } catch {}
      try { await proc.kill?.(); } catch {}
    },
  };
}

// Generic text shell helper.
async function sh(adb, args) {
  try {
    const out = await adb.subprocess.noneProtocol.spawnWaitText(args);
    return typeof out === 'string' ? out : (out?.stdout || String(out));
  } catch (e) {
    return '';
  }
}

// Parse `dumpsys display` and return all display IDs (0 is the main screen).
async function listDisplayIds(adb) {
  const out = await sh(adb, ['dumpsys', 'display']);
  const ids = new Set();
  for (const m of out.matchAll(/mDisplayId=(\d+)/g)) ids.add(parseInt(m[1], 10));
  for (const m of out.matchAll(/Display Id=(\d+)/g)) ids.add(parseInt(m[1], 10));
  for (const m of out.matchAll(/Display (\d+):/g)) ids.add(parseInt(m[1], 10));
  return [...ids].sort((a, b) => a - b);
}

// Resolve the launcher activity for a package (e.g. com.ankama.dofustouch/.MainActivity).
async function resolveLauncherActivity(adb, pkg) {
  // `cmd package resolve-activity --brief` prints two lines; the 2nd is "pkg/.Activity"
  const out = await sh(adb, ['cmd', 'package', 'resolve-activity', '--brief', pkg]);
  const line = out.split('\n').map(s => s.trim()).filter(Boolean).pop() || '';
  return line.includes('/') ? line : null;
}

// Launch a Dofus Touch package on the session's virtual display.
// Called both after connect and from the "Lancer" button (for clones).
async function launchDofusTouch(adb, client, _unused, packageName) {
  const pkg = packageName || DOFUS_TOUCH_PACKAGE;
  const log = (...a) => console.log('[tch:launch]', ...a);

  // 1. Sanity check.
  const pmOut = await sh(adb, ['pm', 'list', 'packages', pkg]);
  const found = pmOut.split('\n').some(l => l.replace(/^package:/, '').trim() === pkg);
  log('package', pkg, 'installed:', found);
  if (!found) {
    if (window.toast) window.toast(pkg + ' ' + T('touchNotInstalled'));
    return;
  }

  // 2. Resolve the launcher activity of the target package.
  const activity = await resolveLauncherActivity(adb, pkg);
  const launchAct = activity || (pkg + '/.MainActivity');

  // 3. Launch on the current session's virtual display so it shows up in
  //    the canvas (not somewhere else on the phone).
  const vdId = (session && session.displayId != null) ? String(session.displayId) : '0';
  log('am start --display', vdId, launchAct);
  const out = await sh(adb, ['am', 'start', '--display', vdId, '-n', launchAct]);
  log('am start out:', (out || '').trim().slice(0, 300));
}

// Clone the currently-connected device's Dofus Touch into a new package
// (com.ankama.dofustouch<suffix>) via the STAKK.exe backend.
// Flow: pm path → sync.read → POST /api/dt/clone → sync.write → pm install.
async function cloneDofusTouch(adb, mod, suffix, statusCb) {
  const log = (...a) => console.log('[tch:clone]', ...a);
  const set = (msg) => { log(msg); statusCb && statusCb(msg); };

  // 1. Find base.apk on the device.
  set(T('touchFindingApk'));
  const pmPath = await adb.subprocess.noneProtocol.spawnWaitText(['pm', 'path', DOFUS_TOUCH_PACKAGE]);
  const lines = String(pmPath).split('\n').map(l => l.replace(/^package:/, '').trim()).filter(Boolean);
  const baseApk = lines.find(p => p.endsWith('/base.apk')) || lines[0];
  if (!baseApk) throw new Error(T('touchApkNotFound'));
  log('base.apk:', baseApk);

  // 2. Pull base.apk via sync. Stream into chunks and concat.
  set(T('touchPullingApk'));
  const sync = await adb.sync();
  let apkBuffer;
  try {
    const readStream = await sync.read(baseApk);
    const reader = readStream.getReader();
    const chunks = [];
    let received = 0;
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.byteLength;
      if (received % (10 * 1024 * 1024) < value.byteLength) {
        set(`Extraction… ${(received / 1024 / 1024).toFixed(0)} Mo`);
      }
    }
    // Merge chunks into a single Uint8Array.
    const total = chunks.reduce((s, c) => s + c.byteLength, 0);
    apkBuffer = new Uint8Array(total);
    let off = 0;
    for (const c of chunks) { apkBuffer.set(c, off); off += c.byteLength; }
    log('pulled', total, 'bytes');
  } finally {
    try { await sync.dispose?.(); } catch {}
  }

  // 3. POST to STAKK.exe clone endpoint.
  set(`${T('touchCloningViaStakk')} ${(apkBuffer.byteLength / 1024 / 1024).toFixed(0)} ${T('touchMbSent')}`);
  const resp = await fetch(API_BASE + '/api/dt/clone?suffix=' + encodeURIComponent(suffix), {
    method: 'POST',
    headers: { 'Content-Type': 'application/vnd.android.package-archive' },
    body: apkBuffer,
  });
  if (!resp.ok) {
    let msg = 'clone endpoint error ' + resp.status;
    try { const j = await resp.json(); msg = j.error || msg; } catch {}
    throw new Error(msg);
  }
  const clonedBuffer = new Uint8Array(await resp.arrayBuffer());
  log('received cloned apk:', clonedBuffer.byteLength, 'bytes');

  // 4. Push cloned APK back to the device.
  const pushPath = '/data/local/tmp/stakk-dt-clone' + suffix + '.apk';
  set(T('touchPushingClone'));
  const sync2 = await adb.sync();
  try {
    const pushStream = new mod.se.ReadableStream({
      start(c) { c.enqueue(new mod.se.Consumable(clonedBuffer)); c.close(); }
    });
    await sync2.write({ filename: pushPath, file: pushStream });
  } finally {
    try { await sync2.dispose?.(); } catch {}
  }
  log('pushed to', pushPath);

  // 5. pm install.
  set(T('touchInstallingClone'));
  const installOut = await adb.subprocess.noneProtocol.spawnWaitText([
    'pm', 'install', '-r', '-t', '-d', pushPath,
  ]);
  log('pm install out:', installOut);
  if (!/Success/i.test(installOut)) {
    throw new Error(T('touchPmInstallFailed') + ': ' + String(installOut).slice(0, 300));
  }

  const newPkg = DOFUS_TOUCH_PACKAGE + (suffix.startsWith('_') ? suffix : '_' + suffix);
  set(T('touchCloneInstalled') + ': ' + newPkg);
  return newPkg;
}

// Parse display IDs out of `dumpsys display` output (multi-format).
function parseDisplayIds(out) {
  const set = new Set();
  for (const m of out.matchAll(/mDisplayId=(\d+)/g)) set.add(parseInt(m[1], 10));
  for (const m of out.matchAll(/Display (\d+):/g)) set.add(parseInt(m[1], 10));
  for (const m of out.matchAll(/Display #(\d+)/g)) set.add(parseInt(m[1], 10));
  return set;
}

// Start a fresh scrcpy session for a given Dofus Touch package. Creates a
// virtual display, launches the app on it, and returns a fully-wired
// `session` object ready to be dropped into `tchSessions`. Does NOT render.
async function addInstance(pkg, label) {
  if (!tchConn) throw new Error('not connected');
  const { adb } = tchConn;
  const log = (...a) => console.log('[tch:inst]', pkg, ...a);

  const dispBefore = parseDisplayIds(await sh(adb, ['dumpsys', 'display']));
  log('displays before:', [...dispBefore]);

  // The Snapdragon H.264 encoder on Samsung Fold 4 can't handle two concurrent
  // 1920x1080 streams. First tab keeps full resolution; every subsequent tab
  // drops to 1280x720 @ 4 Mbps, which leaves enough encoder budget for 3-4
  // simultaneous instances.
  //
  // DPI is set to keep the LOGICAL size (dp) identical across tabs:
  //   1920x1080 / 240dpi × 160 = 1280x720 dp   (first tab)
  //   1280x720  / 160dpi × 160 = 1280x720 dp   (clones)
  // This way Dofus Touch renders the same UI layout in every tab — only the
  // pixel density differs, so clones look slightly less sharp but NOT zoomed.
  const isFirst = tchSessions.length === 0;
  const scrcpyCfg = isFirst
    ? { version: SCRCPY_VERSION, width: VD_WIDTH, height: VD_HEIGHT, dpi: VD_DPI, fps: 60, bitRate: 8_000_000 }
    : { version: SCRCPY_VERSION, width: 1280, height: 720, dpi: 160, fps: 30, bitRate: 4_000_000 };
  log('scrcpyCfg:', scrcpyCfg);
  const scrcpy = await startScrcpyManual(adb, mod.se.ReadableStream, log, scrcpyCfg);
  log('handshake:', scrcpy.meta);

  // Discover the scrcpy-created virtual display.
  await new Promise(r => setTimeout(r, 400));
  const dispAfter = parseDisplayIds(await sh(adb, ['dumpsys', 'display']));
  const newIds = [...dispAfter].filter(id => !dispBefore.has(id));
  const vdId = newIds.length ? newIds[newIds.length - 1] : 0;
  log('virtual display ID:', vdId);

  // Launch the package on the VD.
  const activity = await resolveLauncherActivity(adb, pkg);
  const launchAct = activity || (pkg + '/.MainActivity');
  const startOut = await sh(adb, ['am', 'start', '--display', String(vdId), '-n', launchAct]);
  log('am start →', startOut.trim().slice(0, 200));

  // Build canvas + decoder.
  const canvas = document.createElement('canvas');
  canvas.style.touchAction = 'none';
  canvas.width = scrcpy.meta.width || VD_WIDTH;
  canvas.height = scrcpy.meta.height || VD_HEIGHT;
  const Renderer = mod.dec.BitmapVideoFrameRenderer || mod.dec.InsertableStreamVideoFrameRenderer;
  const renderer = new Renderer(canvas);
  const decoderCodec = scrcpy.meta.codecId ?? mod.scrcpy?.ScrcpyVideoCodecId?.H264 ?? 0x68323634;
  const decoder = new mod.dec.WebCodecsVideoDecoder({ codec: decoderCodec, renderer });
  scrcpy.packets.pipeTo(decoder.writable).catch(err => {
    console.warn('[tch:inst] decoder pipe error', pkg, err);
  });

  const sess = {
    id: Math.random().toString(36).slice(2, 10),
    pkg, label: label || pkg.replace(/^com\.ankama\.dofustouch_?/, '') || 'main',
    scrcpy, canvas, decoder,
    displayId: vdId,
    physW: scrcpy.meta.width || VD_WIDTH,
    physH: scrcpy.meta.height || VD_HEIGHT,
    vw: canvas.width, vh: canvas.height,
  };
  if (typeof decoder.sizeChanged === 'function') {
    decoder.sizeChanged(({ width, height }) => {
      sess.vw = width; sess.vh = height;
      canvas.width = width; canvas.height = height;
    });
  }
  bindInput(canvas, sess);
  tchSessions.push(sess);
  tchActiveId = sess.id;
  syncLegacySession();
  return sess;
}

// Re-launch the active session's app on its virtual display so Android brings
// it back to foreground. Called on tab switch to fix the "black canvas" that
// happens when Android pauses apps on non-focused virtual displays.
async function refocusActiveInstance() {
  const s = activeSession();
  if (!s || !tchConn) return;
  try {
    const activity = await resolveLauncherActivity(tchConn.adb, s.pkg);
    const launchAct = activity || (s.pkg + '/.MainActivity');
    await sh(tchConn.adb, ['am', 'start', '--display', String(s.displayId), '-n', launchAct]);
  } catch (err) { console.warn('[tch] refocus error', err); }
}

// ═══════════════════════════════════════════════════════════════════════════
// Macros — map a PC keyboard key to a tap at a specific canvas region.
// Persisted per Android package so each clone keeps its own shortcuts.
// Storage: localStorage['stakk.macros.<pkg>'] = JSON array of macro records:
//   { key, x, y, cssFx, cssFy, cssFw, cssFh }
// where (x,y) are device-space tap coords, and css* are canvas-relative
// fractions (0..1) used to draw the visual overlay at any canvas size.
// ═══════════════════════════════════════════════════════════════════════════
// Macros are now SHARED across all Dofus Touch instances (main + clones).
// Rationale: same UI layout across accounts — one binding set serves them all.
const MACRO_KEY = 'stakk.macros.shared';
function loadMacros(_pkg) {
  try { return JSON.parse(localStorage.getItem(MACRO_KEY) || '[]'); } catch { return []; }
}
function saveMacros(_pkg, list) {
  try { localStorage.setItem(MACRO_KEY, JSON.stringify(list)); } catch {}
  // Refresh the overlay on every tab, since they all share the macros now.
  for (const s of tchSessions) {
    if (s.id === tchActiveId) renderMacroOverlay(s);
  }
}

// Render the overlay boxes for all macros of the active session, with click-
// to-delete. Called on every view render + after macro add/remove.
function renderMacroOverlay(sess) {
  if (!sess || !sess.box) return;
  // Overlay is placed INSIDE the 16:9 box so it perfectly tracks the canvas.
  sess.box.querySelector('.tch-macros')?.remove();
  const macros = loadMacros(sess.pkg);
  if (!macros.length) return;
  const cw = sess.box.offsetWidth, ch = sess.box.offsetHeight;
  if (!cw || !ch) return;
  const host = document.createElement('div');
  host.className = 'tch-macros';
  host.style.inset = '0';
  for (const m of macros) {
    const el = document.createElement('div');
    el.className = 'tch-macro';
    el.style.left = (m.cssFx * cw) + 'px';
    el.style.top = (m.cssFy * ch) + 'px';
    el.style.width = (m.cssFw * cw) + 'px';
    el.style.height = (m.cssFh * ch) + 'px';
    el.innerHTML = `
      <span class="tch-macro-del" title="Supprimer">×</span>
      <span class="tch-macro-key">${m.key}</span>
    `;
    el.querySelector('.tch-macro-del').onclick = (e) => {
      e.stopPropagation();
      const list = loadMacros(sess.pkg).filter(x => !(x.key === m.key && x.x === m.x && x.y === m.y));
      saveMacros(sess.pkg, list);
      renderMacroOverlay(sess);
    };
    host.appendChild(el);
  }
  sess.box.appendChild(host);
}

// Enter record mode: user drags to pick a region, then presses a key.
function startMacroRecord(sess) {
  if (!sess || !sess.box) return;
  // Capture layer sits on top of the canvas INSIDE the 16:9 box so pointer
  // events and coord math align with the canvas perfectly.
  const rec = document.createElement('div');
  rec.className = 'tch-macro-record';
  rec.style.inset = '0';
  const hint = document.createElement('div');
  hint.className = 'tch-macro-hint';
  const HINT_DEFAULT = T('touchMacroHintSteps');
  hint.textContent = HINT_DEFAULT;
  sess.box.appendChild(rec);
  sess.box.appendChild(hint);

  const rectEl = document.createElement('div');
  rectEl.className = 'tch-macro-rect';
  rec.appendChild(rectEl);
  let start = null;

  const cleanup = () => {
    try { rec.remove(); } catch {}
    try { hint.remove(); } catch {}
    window.removeEventListener('keydown', onEscape);
  };
  const onEscape = (e) => { if (e.key === 'Escape') { cleanup(); } };
  window.addEventListener('keydown', onEscape);

  rec.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const r = rec.getBoundingClientRect();
    start = { x: e.clientX - r.left, y: e.clientY - r.top };
    rectEl.style.left = start.x + 'px';
    rectEl.style.top = start.y + 'px';
    rectEl.style.width = '0px';
    rectEl.style.height = '0px';
  });
  rec.addEventListener('pointermove', (e) => {
    if (!start) return;
    const r = rec.getBoundingClientRect();
    const cur = { x: e.clientX - r.left, y: e.clientY - r.top };
    const x = Math.min(start.x, cur.x);
    const y = Math.min(start.y, cur.y);
    const w = Math.abs(cur.x - start.x);
    const h = Math.abs(cur.y - start.y);
    rectEl.style.left = x + 'px';
    rectEl.style.top = y + 'px';
    rectEl.style.width = w + 'px';
    rectEl.style.height = h + 'px';
  });
  rec.addEventListener('pointerup', (e) => {
    if (!start) { cleanup(); return; }
    const r = rec.getBoundingClientRect();
    const cur = { x: e.clientX - r.left, y: e.clientY - r.top };
    const x = Math.min(start.x, cur.x);
    const y = Math.min(start.y, cur.y);
    const w = Math.max(8, Math.abs(cur.x - start.x));
    const h = Math.max(8, Math.abs(cur.y - start.y));
    start = null;
    hint.textContent = T('touchPressKeyToBind');
    const onKey = (ev) => {
      if (ev.key === 'Escape') { window.removeEventListener('keydown', onKey, true); cleanup(); return; }
      if (ev.key === 'Shift' || ev.key === 'Control' || ev.key === 'Alt' || ev.key === 'Meta') return;
      ev.preventDefault();
      ev.stopPropagation();
      window.removeEventListener('keydown', onKey, true);
      const cssFx = x / r.width, cssFy = y / r.height;
      const cssFw = w / r.width, cssFh = h / r.height;
      const devX = Math.round((x + w / 2) / r.width * sess.physW);
      const devY = Math.round((y + h / 2) / r.height * sess.physH);
      const list = loadMacros(sess.pkg);
      // Replace any existing macro with the same key.
      const filtered = list.filter(m => m.key !== ev.key);
      filtered.push({ key: ev.key, x: devX, y: devY, cssFx, cssFy, cssFw, cssFh });
      saveMacros(sess.pkg, filtered);
      renderMacroOverlay(sess);
      if (window.toast) window.toast('Macro ' + ev.key + ' ' + T('touchMacroSaved'));
      // Stay in record mode for the next rectangle. Reset the visual state
      // and restore the default hint so the user can keep drawing.
      rectEl.style.left = rectEl.style.top = '0px';
      rectEl.style.width = rectEl.style.height = '0px';
      hint.textContent = HINT_DEFAULT;
    };
    window.addEventListener('keydown', onKey, true);
  });
}

// Fire the tap sequence for a macro (DOWN + brief hold + UP) via scrcpy.
async function fireMacro(sess, m) {
  if (!sess || !m) return;
  console.log('[tch:macro] fireMacro DOWN at', m.x, m.y, 'phys=', sess.physW, 'x', sess.physH);
  try {
    await scrcpyTouch(sess, 0 /* DOWN */, m.x, m.y);
  } catch (err) {
    console.warn('[tch:macro] DOWN failed', err);
  }
  setTimeout(async () => {
    try {
      await scrcpyTouch(sess, 1 /* UP */, m.x, m.y);
      console.log('[tch:macro] fireMacro UP at', m.x, m.y);
    } catch (err) {
      console.warn('[tch:macro] UP failed', err);
    }
  }, 70);
}

async function closeInstance(id) {
  const idx = tchSessions.findIndex(s => s.id === id);
  if (idx < 0) return;
  const [s] = tchSessions.splice(idx, 1);
  try { await s.scrcpy.close(); } catch {}
  try { s.decoder?.dispose?.(); } catch {}
  if (tchActiveId === id) tchActiveId = tchSessions[0]?.id || null;
  syncLegacySession();
  window.renderTouchView();
}

// Optional flag: when true, force showing the native USB picker even if a
// device was previously authorized. Exposed via the "Changer de téléphone"
// link in the sidebar so users can switch phones without clearing Chrome.
let forceDevicePicker = false;
// Re-entry guard: WebUSB's claimInterface fails with InvalidStateError if
// a sibling call is still claiming the same device. Double-clicks on the
// Connect button or re-renders of the sidebar could trigger this, so we
// single-gate the whole connect flow.
let connectingInProgress = false;

async function connectDevice() {
  if (connectingInProgress) {
    console.warn('[tch] connect already running — ignored duplicate call');
    if (window.toast) toast(T('touchAlreadyConnecting'));
    return;
  }
  if (tchConn) {
    console.warn('[tch] already connected — ignored');
    if (window.toast) toast(T('touchAlreadyConnected'));
    return;
  }
  connectingInProgress = true;
  if (window.toast) toast(T('touchConnecting'), 3000);
  const el = $('rv-touch');
  const log = (...a) => console.log('[tch]', ...a);
  try {
    setStatus('', 'touchStatusConnecting');
    log('loading modules...');
    const m = await loadModules();
    const mgr = m.usb.AdbDaemonWebUsbDeviceManager.BROWSER;
    if (!mgr) throw new Error(T('touchUnsupported'));

    // Try reusing a previously-authorized device first — Chrome remembers
    // past grants, so returning users skip the native picker entirely.
    let device = null;
    if (!forceDevicePicker) {
      try {
        const existing = await mgr.getDevices();
        if (existing && existing.length) {
          device = existing[0];
          log('reusing authorized device:', device.serial);
        }
      } catch (err) {
        log('getDevices failed (will show picker)', err?.message || err);
      }
    }
    if (!device) {
      // Show a helpful toast BEFORE the native Chrome popup so users know
      // what they're looking at. Chrome's device list is opaque otherwise.
      if (window.toast) toast(T('touchPickInChrome'), 5000);
      device = await mgr.requestDevice();
      forceDevicePicker = false;
    }
    if (!device) { setStatus('', 'touchStatusIdle'); return; }
    log('device selected:', device.serial);

    // Open the USB connection. On most setups the phone was already authorised
    // in a previous session so the RSA public key is cached on the phone — no
    // popup appears, the connection proceeds silently. If the interface is
    // stuck (prior unclean disconnect), retry up to 3 times before giving up
    // with a clear "unplug and replug" recovery message.
    setStatus('warn', 'touchStatusAuth');
    log('opening USB connection to device...');
    let connection = null;
    let connectAttempts = 0;
    while (!connection) {
      const attempt = connectAttempts + 1;
      try {
        log('attempt ' + attempt + ': calling device.connect() — timeout 4s');
        connection = await Promise.race([
          device.connect(),
          new Promise((_, rej) => setTimeout(() => rej(new Error('connect-timeout-4s')), 4000)),
        ]);
        log('attempt ' + attempt + ': device.connect() resolved');
      } catch (err) {
        connectAttempts++;
        const msg = (err && err.message) || String(err);
        log('attempt ' + attempt + ': FAILED —', msg.slice(0, 150));
        if (/claimInterface|already in progress|access denied|InvalidStateError|connect-timeout/i.test(msg) && connectAttempts < 3) {
          log('retrying in 800ms...');
          await new Promise(r => setTimeout(r, 800));
          continue;
        }
        throw new Error(
          T('touchUsbBlocked').replace('{n}', connectAttempts) + ' ' + T('error') + ': ' + msg
        );
      }
    }
    log('USB connection opened — authenticating (popup on phone if first time, else silent)...');
    const CredentialStore = m.cred.default || m.cred.AdbWebCryptoCredentialStore;
    const credentialStore = new CredentialStore('STAKK');
    // Wrap authenticate in a timeout. If the phone doesn't respond within
    // 15 seconds, it's almost certainly a) USB cable is charge-only (no data
    // lines), or b) USB debugging is off, or c) Samsung silently dropped the
    // connection. We surface this clearly instead of hanging forever.
    const transport = await Promise.race([
      m.adb.AdbDaemonTransport.authenticate({
        serial: device.serial, connection, credentialStore,
      }),
      new Promise((_, rej) => setTimeout(() => rej(new Error(
        T('touchAdbTimeout')
      )), 15000)),
    ]);
    const adb = new m.adb.Adb(transport);
    log('adb ready, banner:', adb.banner?.device || '(unknown)');

    // Push the scrcpy server jar ONCE — all instances reuse it.
    setStatus('warn', 'touchStatusPushing');
    const resp = await fetch(SERVER_URL);
    if (!resp.ok) throw new Error(T('touchErrServer'));
    const buf = new Uint8Array(await resp.arrayBuffer());
    const serverStream = new m.se.ReadableStream({
      start(c) { c.enqueue(new m.se.Consumable(buf)); c.close(); }
    });
    await m.scrcpyAdb.AdbScrcpyClient.pushServer(adb, serverStream);
    log('server pushed');

    const shell = await openShell(adb);
    tchConn = { adb, transport, shell, bannerDevice: adb.banner?.device || '' };

    // First instance = main Dofus Touch package.
    setStatus('warn', 'touchStatusStarting');
    await addInstance(DOFUS_TOUCH_PACKAGE, 'main');
    window.renderTouchView();
    if (window.toast) window.toast(T('touchStatusStreaming'));
  } catch (e) {
    console.error('[tch] connect error', e);
    const msg = (e && e.message) || String(e);
    el.innerHTML = `<div class="tch-wrap">
      <div class="tch-head"><div class="tch-title">${T('touch')}</div></div>
      <div class="tch-err">${msg.replace(/</g, '&lt;')}</div>
      <div><button class="tch-btn sec" onclick="window.renderTouchView()">${T('retry')}</button></div>
    </div>`;
    // Best-effort teardown of partially-built state.
    try { await tchConn?.shell?.close?.(); } catch {}
    try { await tchConn?.transport?.close?.(); } catch {}
    tchConn = null;
    tchSessions = [];
    tchActiveId = null;
    syncLegacySession();
  } finally {
    connectingInProgress = false;
  }
}

async function disconnectDevice() {
  for (const s of tchSessions) {
    try { await s.scrcpy.close(); } catch {}
    try { s.decoder?.dispose?.(); } catch {}
  }
  tchSessions = [];
  tchActiveId = null;
  try { await tchConn?.shell?.close?.(); } catch {}
  try { await tchConn?.transport?.close?.(); } catch {}
  tchConn = null;
  syncLegacySession();
  window.renderTouchView();
}

// Convert a pointer event into physical display coordinates for a specific
// session (each tab/instance has its own VD dimensions).
function mapEventToDisplay(sess, canvas, e) {
  const rect = canvas.getBoundingClientRect();
  if (!rect.width || !rect.height || !sess) return null;
  const fx = (e.clientX - rect.left) / rect.width;
  const fy = (e.clientY - rect.top) / rect.height;
  return {
    x: Math.max(0, Math.min(sess.physW - 1, Math.round(fx * sess.physW))),
    y: Math.max(0, Math.min(sess.physH - 1, Math.round(fy * sess.physH))),
  };
}

// Open a persistent `sh` subprocess and return a helper with `.exec(cmd)`
// that just writes a newline-terminated command string to its stdin. This
// avoids spawning a new adb shell per tap (~100 ms latency → ~5-15 ms).
async function openShell(adb) {
  const proc = await adb.subprocess.noneProtocol.spawn('sh');
  const writer = proc.stdin.getWriter();
  const encoder = new TextEncoder();
  // Drain stdout so the remote pipe never backpressures. We don't need the
  // output — input commands are silent on success.
  (async () => {
    try {
      const reader = proc.output.getReader();
      while (true) {
        const r = await reader.read();
        if (r.done) break;
      }
    } catch {}
  })();
  return {
    proc,
    exec: async (cmd) => {
      try {
        await writer.write(encoder.encode(cmd + '\n'));
      } catch (err) {
        console.warn('[tch:input] shell.exec error', err?.message || err);
      }
    },
    close: async () => {
      try { await writer.write(encoder.encode('exit\n')); } catch {}
      try { await writer.close(); } catch {}
      try { await proc.kill?.(); } catch {}
    },
  };
}

// Shell-quote a string with single quotes: 'a&b'  → stays literal. Any
// embedded single quote is escaped via the '\'' trick.
function shq(s) {
  return "'" + String(s).replace(/'/g, "'\\''") + "'";
}

function shellOf(sess) { return sess?.shell || tchConn?.shell || null; }

async function shellTap(sess, x, y) {
  const sh = shellOf(sess); if (!sh) return;
  sh.exec('input -d ' + sess.displayId + ' tap ' + x + ' ' + y);
}

async function shellSwipe(sess, x1, y1, x2, y2, durationMs) {
  const sh = shellOf(sess); if (!sh) return;
  const d = Math.max(50, durationMs | 0);
  sh.exec('input -d ' + sess.displayId + ' swipe ' + x1 + ' ' + y1 + ' ' + x2 + ' ' + y2 + ' ' + d);
}

async function shellKey(sess, keycode) {
  const sh = shellOf(sess); if (!sh) return;
  sh.exec('input -d ' + sess.displayId + ' keyevent ' + keycode);
}

async function shellText(sess, text) {
  const sh = shellOf(sess); if (!sh || !text) return;
  const withSpace = text.replace(/ /g, '%s');
  sh.exec('input -d ' + sess.displayId + ' text ' + shq(withSpace));
}

// Map a JS KeyboardEvent to an Android keycode (or null if the key is
// printable and should be sent via `input text` instead).
// https://developer.android.com/reference/android/view/KeyEvent
function jsKeyToAndroid(e) {
  switch (e.key) {
    case 'Enter': return 66;         // KEYCODE_ENTER
    case 'Backspace': return 67;     // KEYCODE_DEL
    case 'Tab': return 61;           // KEYCODE_TAB
    case 'Escape': return 111;       // KEYCODE_ESCAPE
    case 'ArrowLeft': return 21;
    case 'ArrowUp': return 19;
    case 'ArrowRight': return 22;
    case 'ArrowDown': return 20;
    case 'Delete': return 112;       // KEYCODE_FORWARD_DEL
    case 'Home': return 122;
    case 'End': return 123;
    case 'PageUp': return 92;
    case 'PageDown': return 93;
    case 'F1': return 131;
    case 'F2': return 132;
    case 'F3': return 133;
    case 'F4': return 134;
    case 'F5': return 135;
    case 'F6': return 136;
  }
  return null;
}

// Real-time touch via the manual scrcpy client (raw control socket).
// Bypasses ya-webadb's ScrcpyControlMessageWriter whose Consumable writes
// hang on Samsung Fold + VD (USB bulk endpoint mux back-pressure issue).
let touchErrCount = 0;
let touchCount = 0;
async function scrcpyTouch(sess, action, x, y) {
  if (!sess || !sess.scrcpy) return false;
  try {
    await sess.scrcpy.injectTouch({
      action,
      pointerId: 0n,
      x, y,
      screenW: sess.physW, screenH: sess.physH,
      pressure: action === 1 ? 0 : 1,
      buttons: 0,
    });
    touchCount++;
    if (touchCount <= 5) {
      console.log('[tch:input] manual injectTouch OK action=' + action + ' at (' + x + ',' + y + ') size=' + sess.physW + 'x' + sess.physH);
    }
    return true;
  } catch (err) {
    touchErrCount++;
    if (touchErrCount <= 8) console.warn('[tch:input] manual injectTouch error', err?.message || err);
    return false;
  }
}

function bindInput(canvas, sess) {
  canvas.tabIndex = 0;
  canvas.style.outline = 'none';
  let startPos = null;
  let pointerDown = false;
  let lastMove = 0;
  // Text buffer for PC keyboard → Android input text. Per-session so each tab
  // has its own typing stream.
  let textBuf = '';
  let textTimer = null;
  const flushText = () => {
    if (!textBuf) return;
    const t = textBuf; textBuf = '';
    shellText(sess, t);
  };
  const scheduleFlush = () => {
    if (textTimer) clearTimeout(textTimer);
    textTimer = setTimeout(flushText, 60);
  };

  canvas.addEventListener('keydown', (e) => {
    if (document.activeElement !== canvas) return;
    // Ignore les keydown répétés par l'OS quand la touche est tenue —
    // sinon un appui prolongé fire N macros et Android voit un long press.
    if (e.repeat) return;
    // Alt+digit / Alt+arrow handled globally — don't steal them.
    if (e.altKey) return;
    if ((e.ctrlKey || e.metaKey) && !['a','c','v','x','z','y'].includes(e.key.toLowerCase())) return;
    if (e.key === 'F5' || e.key === 'F12') return;

    // 1. Macro bindings win over typing.
    const macros = loadMacros(sess.pkg);
    const macro = macros.find(mc => mc.key === e.key);
    if (macro) {
      e.preventDefault();
      // Stop la propagation sinon le listener 'document' plus haut re-fire
      // la macro en phase de bubble → double pression sur Android.
      e.stopImmediatePropagation();
      flushText();
      fireMacro(sess, macro);
      return;
    }

    // 2. Special keys → Android keyevent.
    const ak = jsKeyToAndroid(e);
    if (ak !== null) {
      e.preventDefault();
      flushText();
      shellKey(sess, ak);
      return;
    }

    // 3. Printable char → buffered text.
    if (e.key.length === 1) {
      e.preventDefault();
      textBuf += e.key;
      scheduleFlush();
    }
  });

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    canvas.focus();
    flushText();
    const p = mapEventToDisplay(sess, canvas, e);
    if (!p) return;
    startPos = { ...p, time: Date.now() };
    pointerDown = true;
    scrcpyTouch(sess, 0 /* ACTION_DOWN */, p.x, p.y);
  });
  canvas.addEventListener('pointermove', e => {
    if (!pointerDown) return;
    e.preventDefault();
    const now = performance.now();
    if (now - lastMove < 16) return;
    lastMove = now;
    const p = mapEventToDisplay(sess, canvas, e);
    if (!p) return;
    scrcpyTouch(sess, 2, p.x, p.y);
  });
  const finish = (e, cancel) => {
    if (!pointerDown) return;
    pointerDown = false;
    const s = startPos;
    startPos = null;
    if (cancel) { scrcpyTouch(sess, 3, s?.x || 0, s?.y || 0); return; }
    const p = mapEventToDisplay(sess, canvas, e) || s;
    if (!p) return;
    scrcpyTouch(sess, 1, p.x, p.y);
  };
  canvas.addEventListener('pointerup', e => { e.preventDefault(); finish(e, false); });
  canvas.addEventListener('pointercancel', e => { e.preventDefault(); finish(e, true); });
  canvas.addEventListener('pointerleave', e => { if (pointerDown) finish(e, false); });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('dragstart', e => e.preventDefault());
}

// Page-load sync: the inline <script> above runs onGameChange() BEFORE this
// module script finishes loading, so the first call can't render the touch
// view (renderTouchView / renderTouchSidebar aren't defined yet). This
// runs at the END of the module when everything is defined — fixes "blank
// page on F5 in Dofus Touch mode".
if (document.body.classList.contains('mode-touch')) {
  try { window.renderTouchView(); } catch (err) { console.warn('[tch] reload sync failed', err); }
}

</script>
</body>
</html>
